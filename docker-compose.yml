services:
  backend:
    build: ./Backend
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CORS_ORIGIN=*
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

# Note for DB teammate: add a `db` service here (e.g. postgres) once persistence
# lands, plus a DATABASE_URL env var on the backend service pointing at it.
